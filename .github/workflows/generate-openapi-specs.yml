name: Verify OpenAPI Specs

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - "backend/**"

jobs:
  verify-openapi-specs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.21"
          enable-cache: true

      - name: Install dependencies
        run: uv sync
        working-directory: ./backend

      - name: Generate OpenAPI spec
        run: bash scripts/generate-openapi-specs.sh

      - name: Check for uncommitted changes
        run: |
          git diff --exit-code -- frontend/openapi.json \
            || (echo "frontend/openapi.json is outdated. Run scripts/generate-openapi-specs.sh and commit the result" && exit 1)